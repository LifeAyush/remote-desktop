name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx react-scripts test --watchAll=false
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      API_TOKEN: ci-token-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/tasks)" = 401
          # the stack's own containers are listed and marked protected
          curl -fsS -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8080/api/tasks | grep -q '"protected":true'
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
